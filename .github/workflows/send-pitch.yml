name: send-pitch-email

# Manual outreach: send a pitch email as andrew@permitpicker.com via Resend,
# with replies routed to the reply_to address. Optionally attaches fresh
# weekly PDF + daily HTML teaser samples built from the latest published data.
#
# Trigger: Actions tab -> send-pitch-email -> Run workflow (works from the
# GitHub mobile app too).

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email address'
        required: true
      subject:
        description: 'Subject line'
        required: true
      body:
        description: 'Email body (plain text; blank lines separate paragraphs)'
        required: true
      reply_to:
        description: 'Where replies go'
        default: 'permitpicker@gmail.com'
      attach_sample:
        description: 'Attach fresh weekly PDF + daily HTML teaser samples'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF deps
        if: ${{ inputs.attach_sample }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libjpeg-dev libopenjp2-7-dev libffi-dev > /dev/null
          pip install -q weasyprint

      - name: Build sample PDF and send pitch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ATTACH_ARGS=""
          if [ "${{ inputs.attach_sample }}" = "true" ]; then
            # Internal data copy (private Storage; the public
            # permits.json no longer carries phone numbers, and the
            # samples need them — phones are the product).
            curl -sf -o /tmp/pp.json \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "$SUPABASE_URL/storage/v1/object/internal/permits_full.json"
            curl -sf -o /tmp/first_seen.json https://permitpicker.com/data/first_seen.json
            # Weekly PDF sample.
            python pipeline/weekly_report.py --no-sample --teaser-rows 12 \
              --out /tmp/pitch-sample.html \
              --src /tmp/pp.json --first-seen /tmp/first_seen.json
            ATTACH_ARGS="--attach /tmp/pitch-sample.pdf"
            # Daily HTML call-sheet teaser (digest.py reads web/data/).
            cp /tmp/pp.json web/data/permits.json
            cp /tmp/first_seen.json web/data/first_seen.json
            python pipeline/digest.py --trade electrical --days 7 \
              --brand PermitPulse --html-out /tmp/pitch-daily-full.html
            python pipeline/pitch_daily_teaser.py \
              --in /tmp/pitch-daily-full.html --out /tmp/pitch-daily.html
            ATTACH_ARGS="$ATTACH_ARGS --attach /tmp/pitch-daily.html"
          fi
          # Body input -> text file; paragraphs split on blank lines.
          printf '%s' "${{ inputs.body }}" > /tmp/pitch-body.txt
          python - <<'EOF'
          import html
          text = open('/tmp/pitch-body.txt').read()
          paras = [p.strip() for p in text.split('\n\n') if p.strip()]
          body_html = ''.join(
              f'<p style="margin:0 0 12px 0;">{html.escape(p).replace(chr(10), "<br>")}</p>'
              for p in paras)
          sig = ('<p style="margin:16px 0 0 0;">— Andrew<br>'
                 'PermitPulse by PermitPicker<br>'
                 '<a href="https://permitpicker.com">permitpicker.com</a></p>')
          page = (f'<html><body style="font-family:Arial,sans-serif;'
                  f'font-size:14px;color:#222;max-width:600px;">'
                  f'{body_html}{sig}</body></html>')
          open('/tmp/pitch-body.html', 'w').write(page)
          print('pitch html bytes:', len(page))
          EOF
          python pipeline/send_digest.py --to "${{ inputs.to }}" \
            --subject "${{ inputs.subject }}" \
            --body-file /tmp/pitch-body.txt --html-file /tmp/pitch-body.html \
            --from "andrew@permitpicker.com" \
            --reply-to "${{ inputs.reply_to }}" $ATTACH_ARGS
