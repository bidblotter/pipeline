name: daily-permit-ingest

on:
  schedule:
    # 11:00 UTC = 7:00 AM EDT / 6:00 AM EST
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many days (0 = use watermarks)"
        default: "0"
      raleigh_backfill_days:
        description: "Backfill this many days for Raleigh only (0 = use backfill_days)"
        default: "0"
      send_digest:
        description: "Send test digest email after export (true/false)"
        default: "false"
      digest_to:
        description: "Digest recipient email (empty = skip free digest)"
        default: ""
      digest_trade:
        description: "Digest trade keyword (e.g. electrical)"
        default: "electrical"
      digest_days:
        description: "Digest lookback window in days"
        default: "7"
      weekly_to:
        description: "Send weekly PDF report to this email (empty = skip)"
        default: ""
      weekly_trade:
        description: "Weekly report trade (currently electrical only)"
        default: "electrical"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python pipeline/ingest.py
      - name: Run Durham ingest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/durham.py
      - name: Run Cary ingest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python pipeline/cary.py
      - name: Run Raleigh ingest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ inputs.raleigh_backfill_days != '0' && inputs.raleigh_backfill_days || inputs.backfill_days }}
        run: python pipeline/raleigh.py
      - name: Export preview data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/export.py
      - name: Rebuild prospect list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/prospects.py
      - name: Inject public keys into site
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s/PASTE_ANON_KEY_HERE/$SUPABASE_ANON_KEY/g" web/index.html
            echo "anon key injected"
          else
            echo "SUPABASE_ANON_KEY not set — signup form will be inert"
          fi
      - name: Send digest
        if: ${{ inputs.send_digest == 'true' || github.event_name == 'schedule' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # No weekend sends (customer timezone)
          if [ "$(TZ=America/New_York date +%u)" -gt 5 ]; then
            echo "weekend — skipping free digest"; exit 0
          fi
          TO="${{ inputs.digest_to }}"
          TRADE="${{ inputs.digest_trade }}"
          DAYS="${{ inputs.digest_days }}"
          # Free digest is opt-in: only sends when digest_to is passed on dispatch.
          # (Customer digests send separately via DIGEST_CUSTOMERS.)
          [ -z "$TO" ] && { echo "no digest_to input — skipping free digest"; exit 0; }
          [ -z "$TRADE" ] && TRADE="electrical"
          [ -z "$DAYS" ] && DAYS="7"
          python pipeline/digest.py --trade "$TRADE" --days "$DAYS" --out /tmp/digest.txt > /tmp/digest_meta.txt
          SUBJECT=$(grep "^SUBJECT: " /tmp/digest_meta.txt | sed 's/^SUBJECT: //')
          [ -z "$SUBJECT" ] && SUBJECT="PermitPicker morning digest: $TRADE"
          python pipeline/send_digest.py --to "$TO" --subject "$SUBJECT" --body-file /tmp/digest.txt
      - name: Send customer digests
        if: ${{ inputs.send_digest == 'true' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_CUSTOMERS: ${{ secrets.DIGEST_CUSTOMERS }}
        run: |
          # No weekend sends (customer timezone)
          if [ "$(TZ=America/New_York date +%u)" -gt 5 ]; then
            echo "weekend — skipping customer digests"; exit 0
          fi
          python pipeline/send_customer_digests.py
      - name: Send weekly report (manual)
        if: ${{ inputs.weekly_to != '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libjpeg-dev libopenjp2-7-dev libffi-dev > /dev/null
          pip install -q weasyprint
          cp web/data/permits.json /tmp/pp.json
          cp web/data/first_seen.json /tmp/first_seen.json
          python pipeline/weekly_report.py --no-sample --out /tmp/weekly-report.html \
            --src /tmp/pp.json --first-seen /tmp/first_seen.json
          cat > /tmp/weekly-body.txt <<'EOF'
          Your weekly PermitPulse briefing is attached.

          New contractors, biggest movers, and every electrical permit filed this
          week in Raleigh and Cary — with tap-to-call numbers.

          — PermitPulse by PermitPicker
          EOF
          python pipeline/send_digest.py --to "${{ inputs.weekly_to }}" \
            --subject "Your weekly PermitPulse briefing — electrical" \
            --body-file /tmp/weekly-body.txt --attach /tmp/weekly-report.pdf
      - name: Notify new signups
        if: ${{ inputs.send_digest == 'true' || github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TO="${{ inputs.digest_to }}"
          [ -z "$TO" ] && TO="permitpicker@gmail.com"
          python pipeline/notify_signups.py --out /tmp/signups.txt
          if [ -s /tmp/signups.txt ]; then
            python pipeline/send_digest.py --to "$TO" --subject "PermitPicker: new waitlist signups" --body-file /tmp/signups.txt
          else
            echo "no new signups"
          fi
      - name: Build contractor first-seen lookup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python pipeline/contractor_first_seen.py
      - name: Build contractor vCards
        run: |
          python pipeline/build_vcards.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: ingest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
