name: daily-permit-ingest

on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT / 5:00 AM EST
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many days (0 = use watermarks)"
        default: "0"
      send_digest:
        description: "Send test digest email after export (true/false)"
        default: "false"
      digest_to:
        description: "Digest recipient email"
        default: "bidblotter@gmail.com"
      digest_trade:
        description: "Digest trade keyword (e.g. electrical)"
        default: "electrical"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python pipeline/ingest.py
      - name: Run Durham ingest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/durham.py
      - name: Export preview data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/export.py
      - name: Rebuild prospect list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline/prospects.py
      - name: Send test digest
        if: ${{ inputs.send_digest == 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python pipeline/digest.py --trade "${{ inputs.digest_trade }}" --days 7 --out /tmp/digest.txt
          python pipeline/send_digest.py --to "${{ inputs.digest_to }}" --subject "BidBlotter: ${{ inputs.digest_trade }} permits (Actions test)" --body-file /tmp/digest.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: ingest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
