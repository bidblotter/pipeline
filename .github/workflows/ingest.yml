name: daily-permit-ingest

on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT / 5:00 AM EST
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many days (0 = use watermarks)"
        default: "0"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: python pipeline/ingest.py
