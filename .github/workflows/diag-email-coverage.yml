name: diag-email-coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure contractor email coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -o /tmp/permits_full.json \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/storage/v1/object/internal/permits_full.json" \
            || curl -sf -o /tmp/permits_full.json https://permitpicker.com/data/permits.json
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_KEY"]
          H = {"apikey": key, "Authorization": f"Bearer {key}"}
          recs = json.load(open("/tmp/permits_full.json"))
          phones = set()
          for r in recs:
              p = (r.get("contractor_phone") or "").strip()
              if p:
                  phones.add(p)
          print("export records:", len(recs), "| distinct phones in export:", len(phones))
          email_by_phone = {}
          off = 0
          while True:
              q = urllib.parse.urlencode({
                  "select": "contractor_phone,contractor_email",
                  "contractor_email": "not.is.null",
                  "order": "contractor_phone.asc",
                  "limit": "1000", "offset": str(off)})
              req = urllib.request.Request(url + "/rest/v1/permits?" + q, headers=H)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  rows = json.loads(resp.read())
              if not rows:
                  break
              for row in rows:
                  p = (row.get("contractor_phone") or "").strip()
                  e = (row.get("contractor_email") or "").strip()
                  if p and e and p not in email_by_phone:
                      email_by_phone[p] = e
              off += 1000
          valid = {p: e for p, e in email_by_phone.items() if "@" in e}
          covered = phones & set(valid)
          print("table phones with any non-null email:", len(email_by_phone))
          print("table phones with plausible email (has @):", len(valid))
          print("export phones covered by a plausible email:", len(covered),
                f"({100.0 * len(covered) / max(1, len(phones)):.1f}% of export phones)")
          print("export phones NOT covered:", len(phones) - len(covered))
          # show a few sample covered phones are masked to last 4
          samp = sorted(covered)[:5]
          print("sample covered (masked):", ["***" + p[-4:] for p in samp])
          PY
